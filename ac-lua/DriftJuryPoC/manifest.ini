[ABOUT]
NAME = Drift Jury (PoC)
AUTHOR = DriftFactory
VERSION = 0.1.0
DESCRIPTION = Fase 1 Proof of Concept do Juri Automatico de Drift: leitura de telemetria, drift angle, Start/Finish Gate, uma Drift Zone, score simples e HUD de debug.

[CORE]
LAZY = NONE  ; must keep running (script.update) even while the window is closed, so gate detection never misses a crossing

[WINDOW_...]
ID = main
NAME = Drift Jury (PoC)
ICON = icon.png
FUNCTION_MAIN = windowMain
MIN_SIZE = 300, 200
DEFAULT_POSITION = 60, 60

[RENDER_CALLBACKS]
; Without this, CSP never invokes any 3D-drawing callback for the app at
; all — confirmed missing by comparing against DriftJudgeSP's manifest.ini,
; which is why render.debug* calls never showed anything, however/wherever
; they were called from.
TRANSPARENT = draw3D
